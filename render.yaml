# =============================================================================
# Render Blueprint Specification for FoodBridge
# Team EcoConnect - Sri Lanka
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Backend REST API (Spring Boot 3 + PostgreSQL)
  # ---------------------------------------------------------------------------
  - type: web
    name: foodbridge-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: PORT
        value: 8080

      - key: SPRING_PROFILES_ACTIVE
        value: default

      # Supabase PostgreSQL Database Credentials
      - key: DB_URL
        sync: false
        # Example: jdbc:postgresql://db.YOUR_PROJECT_REF.supabase.co:5432/postgres?sslmode=require

      - key: DB_USERNAME
        sync: false
        # Example: postgres

      - key: DB_PASSWORD
        sync: false

      - key: DB_POOL_MAX
        value: 10

      - key: DB_POOL_MIN
        value: 2

      # Security & JWT Configuration
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRATION_MS
        value: 3600000

      - key: JWT_REFRESH_EXPIRATION_MS
        value: 604800000

      # Cross-Origin Resource Sharing (CORS)
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:3000,https://*.netlify.app,https://foodbridge.netlify.app,https://foodbridge.lk

      # Supabase Storage & Services Integration
      - key: SUPABASE_URL
        sync: false
        # Example: https://YOUR_PROJECT_REF.supabase.co

      - key: SUPABASE_ANON_KEY
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: SUPABASE_STORAGE_BUCKET
        value: foodbridge-uploads

      # Initial Default Admin Account
      - key: ADMIN_EMAIL
        value: admin@foodbridge.lk

      - key: ADMIN_PASSWORD
        value: Admin@FoodBridge2026

      - key: ADMIN_NAME
        value: FoodBridge Platform Administrator

      - key: ADMIN_PHONE
        value: +94112345678
