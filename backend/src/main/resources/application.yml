server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: foodbridge-backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  datasource:
    # Supabase PostgreSQL JDBC connection string
    # e.g., jdbc:postgresql://db.xxxx.supabase.co:5432/postgres?sslmode=require
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:require}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      # Prevents application crash on startup if remote database is momentarily unreachable
      initialization-fail-timeout: ${DB_INIT_FAIL_TIMEOUT:-1}

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

# FoodBridge platform custom configuration
app:
  admin:
    email: ${ADMIN_EMAIL:admin@foodbridge.lk}
    password: ${ADMIN_PASSWORD:Admin@FoodBridge2026}
    name: ${ADMIN_NAME:FoodBridge Administrator}
    phone: ${ADMIN_PHONE:+94112345678}
  cors:
    # Comma-separated list of allowed origins (e.g., React dev server http://localhost:5173)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:foodbridge-super-secret-jwt-signing-key-ecoconnect-sri-lanka-min-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  supabase:
    url: ${SUPABASE_URL:https://your-project-id.supabase.co}
    anon-key: ${SUPABASE_ANON_KEY:your-supabase-anon-key}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:your-supabase-service-role-key}

